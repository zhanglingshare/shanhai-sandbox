<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黄仁勋结局模拟器 · 社会计算沙箱</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --bg:#080b12; --bg2:#0c111d; --panel:#121a2c; --panel2:#172136; --line:#22304d;
  --txt:#e8eefc; --sub:#93a2c0; --mut:#64748f;
  --cyan:#3ee0ff; --vio:#8b7bff; --grn:#3ddc97; --amb:#ffb454; --red:#ff5c7a; --blu:#5aa2ff;
  --glow:0 0 24px rgba(62,224,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 80% -10%,#14233f 0%,var(--bg) 55%),var(--bg);
  color:var(--txt);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:.2px}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 16px 110px}
@media(min-width:900px){#app{max-width:1180px}}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.5px}
a{color:var(--cyan);text-decoration:none}
.mut{color:var(--mut)}.sub{color:var(--sub)}
.cyan{color:var(--cyan)}.vio{color:var(--vio)}.grn{color:var(--grn)}.amb{color:var(--amb)}.red{color:var(--red)}.blu{color:var(--blu)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}.grow{flex:1}.center{align-items:center}.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--line);
  border-radius:16px;padding:18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(62,224,255,.5),transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--sub);white-space:nowrap}
.chip.on{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.t-conf{background:rgba(61,220,151,.15);color:var(--grn)}
.t-rep{background:rgba(255,180,84,.15);color:var(--amb)}
.t-rum{background:rgba(255,92,122,.15);color:var(--red)}
.t-miss{background:rgba(100,116,143,.18);color:var(--mut)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:13px 18px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
  transition:.15s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,#0e7d96,#1560c8);border-color:transparent;box-shadow:var(--glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{padding:34px 6px 10px}
.kicker{font-size:12px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase}
.big{font-size:30px;line-height:1.25;font-weight:900;margin:8px 0}
@media(min-width:900px){.big{font-size:40px}}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-size:24px;font-weight:800;font-family:ui-monospace,monospace}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h .no{font-family:ui-monospace,monospace;color:var(--cyan);font-size:13px}
.sec-h h2{font-size:20px}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--cyan) var(--p,50%),var(--line) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid var(--cyan);box-shadow:var(--glow);cursor:pointer}
.knob .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.knob .val{font-family:ui-monospace,monospace;color:var(--cyan);font-weight:700}
canvas{display:block;width:100%;border-radius:10px}
.cv-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);cursor:pointer;transition:.15s}
.opt:active{transform:.98}.opt.sel{border-color:var(--cyan);box-shadow:var(--glow)}
.opt h4{display:flex;align-items:center;gap:8px}
.divider{height:1px;background:var(--line);margin:14px 0}
.pill-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(10,14,22,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.pill-nav .inner{max-width:1180px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pill-nav .inner::-webkit-scrollbar{display:none}
.pn{flex:0 0 auto;padding:8px 12px;border-radius:10px;font-size:13px;color:var(--sub);cursor:pointer;border:1px solid transparent;white-space:nowrap}
.pn.on{color:var(--cyan);background:var(--panel2);border-color:var(--line)}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;background:linear-gradient(90px,var(--cyan),var(--blu));transition:.3s}
.barline{display:flex;align-items:center;gap:10px;margin:9px 0}
.barline .lab{width:118px;font-size:13px;color:var(--sub);flex:0 0 auto}
.barline .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.barline .fill{height:100%;border-radius:6px}
.barline .num{width:64px;text-align:right;font-family:ui-monospace,monospace;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:0 14px;margin:8px 0}
details summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px solid var(--line)}
details .body{padding:12px 0}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--cyan);color:var(--txt);padding:10px 18px;border-radius:10px;z-index:99;box-shadow:var(--glow);
  opacity:0;transition:.25s;pointer-events:none;max-width:90%;font-size:14px}
.toast.show{opacity:1}
.flow-node{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.flow-lat{fill:#1a2740;stroke:var(--cyan);stroke-width:1.5}
.flow-text{fill:var(--txt);font-size:12px;font-family:inherit}
.flow-path{stroke-width:1.8;fill:none;marker-end:url(#arrow)}
.hidden{display:none}
.fade{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.src{font-size:11px;word-break:break-all;color:var(--mut)}
.dash{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>

/* ================= M3 系统动力学 ================= */
function m3Point(x){let pi=0,cp=0,tr=1,al=0;const{E,P,Pol,M,C}=x;
 for(let t=0;t<30;t++){pi=clamp(pi+.15*P-.02*pi);cp=clamp(cp+.12*(.6*E+.4*Pol)-.03*cp);
  tr=clamp(tr-.10*M-.08*cp+.06*C);al=clamp(al+.10*C-.05*cp);}
 return softmax([1.4*al+1.2*tr-1.5*cp-1.0*pi,1.3*pi+1.2*cp+.8*M-.8*al,
  1.0*pi+.6*tr-.4*cp,1.4*cp+.8*E-.6*al]);}
function mcM3(x0){const rng=mulberry32(SEED+2),N=6000;const acc={};STATES.forEach(s=>acc[s]=[]);
 for(let n=0;n<N;n++){const x=perturb(rng,x0);m3Point(x).forEach((p,i)=>acc[STATES[i]].push(p));}
 const o={};STATES.forEach(s=>o[s]=q(acc[s]));return o;}

/* ================= M4 贝叶斯网络 ================= */
function m4(x0){const ph=clamp(.5*x0.E+.5*x0.Pol),par=[ph,x0.P,x0.M,x0.C];const dist=[0,0,0,0];
 for(let bits=0;bits<16;bits++){const st=[0,1,2,3].map(k=>(bits>>k)&1);let w=1;
  st.forEach((v,i)=>w*=v?par[i]:1-par[i]);
  const x={E:st[0],P:st[1],Pol:st[0],M:st[2],C:st[3]};
  pointM1(x).forEach((p,i)=>dist[i]+=w*p);}
 return dist;}

/* ================= SNA 图结构与中心度 ================= */
function buildGraph(edges){const names=[...new Set(edges.flatMap(e=>[e.source,e.target]))];
 const idx={};names.forEach((n,i)=>idx[n]=i);const k=names.length;
 const adj=Array.from({length:k},()=>Array(k).fill(0));
 edges.forEach(e=>{const a=idx[e.source],b=idx[e.target];adj[a][b]+=e.strength;adj[b][a]+=e.strength;});
 const degree=adj.map(r=>r.reduce((a,b)=>a+b,0));
 const bc=Array(k).fill(0);
 for(let src=0;src<k;src++){const pred={},sigma=Array(k).fill(0),dist=Array(k).fill(-1),stack=[],qq=[];
  dist[src]=0;sigma[src]=1;qq.push(src);
  while(qq.length){const v=qq.shift();stack.push(v);
   for(let w=0;w<k;w++){if(adj[v][w]<=0)continue;
    if(dist[w]<0){dist[w]=dist[v]+1;qq.push(w);}
    if(dist[w]===dist[v]+1){sigma[w]+=sigma[v];(pred[w]=pred[w]||[]).push(v);}}}
  const delta=Array(k).fill(0);
  while(stack.length){const w=stack.pop();(pred[w]||[]).forEach(v=>delta[v]+=sigma[v]/sigma[w]*(1+delta[w]));
   if(w!==src)bc[w]+=delta[w];}}
 const norm=(k-1)*(k-2)||1;
 return{names,idx,adj,degree,between:bc.map(b=>b/norm)};}

/* 力导向仿真 */
class ForceGraph{
 constructor(edges,canvas){this.g=buildGraph(edges);this.cv=canvas;this.removed=new Set();
  const k=this.g.names.length;this.px=[];this.py=[];this.vx=Array(k).fill(0);this.vy=Array(k).fill(0);
  const rng=mulberry32(7);for(let i=0;i<k;i++){this.px[i]=rng()*2-1;this.py[i]=rng()*2-1;}
  this.links=[];edges.forEach(e=>this.links.push({a:this.g.idx[e.source],b:this.g.idx[e.target],s:e.strength,rel:e.relation}));
  this.alpha=1;}
 isolate(step){ // 确定性地移除与黄仁勋相连的边，直到移除数等于 step
  const hub=this.g.idx['黄仁勋本人'];
  const hubEdges=this.links.map((l,i)=>({l,i})).filter(o=>o.l.a===hub||o.l.b===hub)
   .sort((u,v)=>v.l.s-u.l.s);
  for(let n=0;n<step&&n<hubEdges.length;n++)this.removed.add(hubEdges[n].i);}
 reset(){this.removed.clear();}
 tick(){const k=this.g.names.length,rep=1.7;
  for(let i=0;i<k;i++){let fx=-this.px[i]*.055,fy=-this.py[i]*.055;
   for(let j=0;j<k;j++){if(i===j)continue;let dx=this.px[i]-this.px[j],dy=this.py[i]-this.py[j];
    let d2=dx*dx+dy*dy+.02,fr=rep/d2;fx+=dx*fr;fy+=dy*fr;}
   this.vx[i]=(this.vx[i]+fx*.012)*.85;this.vy[i]=(this.vy[i]+fy*.012)*.85;}
  this.links.forEach((l,i)=>{if(this.removed.has(i))return;
   let dx=this.px[l.b]-this.px[l.a],dy=this.py[l.b]-this.py[l.a],d=Math.sqrt(dx*dx+dy*dy)+.01;
   const f=(d-.5)*.04*l.s;this.vx[l.a]+=dx/d*f;this.vy[l.a]+=dy/d*f;this.vx[l.b]-=dx/d*f;this.vy[l.b]-=dy/d*f;});
  for(let i=0;i<k;i++){this.px[i]=clamp(this.px[i]+this.vx[i],-1.02,1.02);this.py[i]=clamp(this.py[i]+this.vy[i],-1.02,1.02);}}
 draw(){const c=setupCanvas(this.cv),Wd=this.cv.width/c.dpr,Hd=this.cv.height/c.dpr,ctx=c.ctx;
  ctx.clearRect(0,0,Wd,Hd);const hub=this.g.idx['黄仁勋本人'];
  this.links.forEach((l,i)=>{const cut=this.removed.has(i);
   ctx.strokeStyle=cut?'rgba(100,116,143,.25)':(l.rel==='合规'?'rgba(255,92,122,.7)':'rgba(62,224,255,.45)');
   ctx.lineWidth=cut?.6:1.2;if(cut)ctx.setLineDash([4,4]);
   ctx.beginPath();ctx.moveTo(Wd/2+this.px[l.a]*Wd*.32,Hd/2+this.py[l.a]*Hd*.38);
   ctx.lineTo(Wd/2+this.px[l.b]*Wd*.32,Hd/2+this.py[l.b]*Hd*.38);ctx.stroke();ctx.setLineDash([]);});
  this.g.names.forEach((n,i)=>{const x=Wd/2+this.px[i]*Wd*.32,y=Hd/2+this.py[i]*Hd*.38;
   const r=i===hub?11:7;ctx.beginPath();ctx.arc(x,y,r,0,7);
   ctx.fillStyle=i===hub?'#3ee0ff':'#172136';ctx.fill();
   ctx.strokeStyle=i===hub?'#fff':'#3ee0ff';ctx.lineWidth=i===hub?2:1;ctx.stroke();
   ctx.fillStyle='#e8eefc';ctx.font='11px sans-serif';ctx.textAlign='center';
   ctx.fillText(shortName(n),x,y+r+13);});}
}
function shortName(n){const m={'黄仁勋本人':'黄仁勋','临时CEO Colette Kress':'临时CEO','独立董事':'独立董事',
 '独立律所Wachtell与检察官Joon H. Kim':'独立律所','监管机构':'监管','机构股东':'机构股东','盟友战情室':'盟友',
 '员工群体':'员工','大客户（微软/谷歌/亚马逊/Meta/OpenAI）':'大客户','董事会成员（含董事长Harvey C. Jones）':'董事会'};
 return m[n]||n.slice(0,6);}

/* ================= Canvas 通用 ================= */
function setupCanvas(cv){const dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
 cv.width=rect.width*dpr;cv.height=rect.height*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 return{ctx,dpr,w:rect.width,h:rect.height};}
function drawLine(cv,series,opts){opts=opts||{};const{ctx,w,h}=setupCanvas(cv);
 const pad=34;const all=series.flatMap(s=>s.data);let mn=Math.min(...all),mx=Math.max(...all);
 if(opts.zero){mn=Math.min(mn,0);}const xr=v=>pad+(v/( (series[0].data.length-1))*(w-pad*1.4));
 const yr=v=>h-pad-((v-mn)/((mx-mn)||1))*(h-pad*1.6);
 ctx.strokeStyle='#22304d';ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-8,h-pad);ctx.stroke();
 ctx.fillStyle='#64748f';ctx.font='10px monospace';
 series.forEach(s=>{ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
  s.data.forEach((v,i)=>{const x=xr(i),y=yr(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
 if(opts.labels){opts.labels.forEach((l,i)=>{ctx.fillStyle='#64748f';ctx.fillText(l,pad+i*(w-pad*1.4)/((opts.labels.length-1)||1),h-12);});}
 }
function drawBars(cv,labels,vals,colors,horizontal){const{ctx,w,h}=setupCanvas(cv);
 if(horizontal){const n=vals.length,bh=(h-8)/n;const mx=Math.max(...vals);
  vals.forEach((v,i)=>{const y=6+i*bh,bw=(v/mx)*(w-168);
   ctx.fillStyle=colors[i]||'#3ee0ff';ctx.beginPath();ctx.roundRect(110,y+3,bw,bh-8,4);ctx.fill();
   ctx.fillStyle='#93a2c0';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText(labels[i],104,y+bh/2+3);
   ctx.fillStyle='#e8eefc';ctx.textAlign='left';ctx.fillText((v*100).toFixed(1)+'%',114+bw,y+bh/2+3);});}
 else{const n=vals.length,bw=(w-20)/n,mx=Math.max(...vals);
  vals.forEach((v,i)=>{const x=10+i*bw,bh=(v/mx)*(h-34);
   ctx.fillStyle=colors[i]||'#3ee0ff';ctx.beginPath();ctx.roundRect(x+4,h-24-bh,bw-8,bh,5);ctx.fill();
   ctx.fillStyle='#93a2c0';ctx.font='10px sans-serif';ctx.textAlign='center';
   ctx.fillText(labels[i],x+bw/2,h-10);});}}
function drawHist(cv,arr,color){const{ctx,w,h}=setupCanvas(cv),bins=28,pad=20;
 let mn=Math.min(...arr),mx=Math.max(...arr);const counts=Array(bins).fill(0);
 arr.forEach(v=>{let b=Math.floor((v-mn)/((mx-mn)||1)*bins);b=clamp(b,0,bins-1);counts[b]++;});
 const cm=Math.max(...counts),bw=(w-pad*1.4)/bins;
 counts.forEach((c,i)=>{const bh=c/cm*(h-pad*1.8);ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(pad+i*bw,h-pad-bh,bw-1.5,bh,2);ctx.fill();});
 ctx.fillStyle='#64748f';ctx.font='10px monospace';ctx.textAlign='left';
 ctx.fillText(mn.toFixed(3),pad,h-6);ctx.textAlign='right';ctx.fillText(mx.toFixed(3),w-8,h-6);}
function drawHeat(cv,grid,xl,yl){const{ctx,w,h}=setupCanvas(cv),pad=40;
 const cw=(w-pad-8)/grid[0].length,ch=(h-pad-14)/grid.length;
 grid.forEach((r,j)=>r.forEach((v,i)=>{const t=clamp(v);
  ctx.fillStyle=`rgba(62,224,255,${.08+t*.85})`;ctx.fillRect(pad+i*cw,8+j*ch,cw-1,ch-1);
  ctx.fillStyle=t>.55?'#080b12':'#cfe0ff';ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillText(v.toFixed(2),pad+i*cw+cw/2,8+j*ch+ch/2+3);}));
 ctx.fillStyle='#93a2c0';ctx.font='10px sans-serif';ctx.textAlign='center';
 xl.forEach((l,i)=>ctx.fillText(l,pad+(i+.5)*cw,h-2));
 ctx.textAlign='right';yl.forEach((l,j)=>ctx.fillText(l,pad-6,8+(j+.5)*ch));}

/* ================= 模型引擎（四模型并行） ================= */
R.models=function(el){
 el.innerHTML=`<div class="sec"><div class="sec-h"><span class="no">07</span><h2>模型引擎：四个模型，一组分歧</h2><span class="rule"></span></div>
 <div class="card">
  <div class="row between center"><h3>蒙特卡洛引擎</h3><span class="chip mono" id="mcprog">待运行</span></div>
  <div class="cv-wrap" style="margin-top:12px"><canvas id="mccan" height="200"></canvas></div>
  <div class="legend"><span><i style="background:#3ddc97"></i>回归概率经验分布</span></div>
  <div class="row" style="margin-top:12px">
   <button class="btn primary sm" id="runmc">运行 6000 次蒙特卡洛</button>
   <button class="btn ghost sm" id="runmc4">对照：锁死向心力</button></div>
  <div id="mcq" class="grid3" style="margin-top:14px"></div>
 </div>
 <div class="card" style="margin-top:14px">
  <h3>四模型分歧带（P50）</h3>
  <div class="cv-wrap" style="margin-top:12px"><canvas id="ens" height="240"></canvas></div>
  <div class="legend">
   <span><i style="background:#3ee0ff"></i>M1 规则softmax</span>
   <span><i style="background:#5aa2ff"></i>M2 贝叶斯logistic</span>
   <span><i style="background:#ffb454"></i>M3 系统动力学</span>
   <span><i style="background:#8b7bff"></i>M4 贝叶斯网络</span></div>
  <div id="enstable" style="margin-top:12px"></div>
 </div>
 <button class="btn primary" style="margin-top:16px" onclick="go('detail')">进入输出详情下钻 →</button></div>`;

 const mccan=document.getElementById('mccan');
 function animate(dropC,cb){
  const rng=mulberry32(SEED),N=6000,batch=400;let done=0;const arr=[];
  document.getElementById('mcprog').textContent='0 / '+N;
  function step(){
   for(let i=0;i<batch&&done<N;i++,done++){let x=perturb(rng,S.knobs);if(dropC)x.C=0;
    arr.push(pointM1(x)[0]);}
   drawHist(mccan,arr,'#3ddc97');
   document.getElementById('mcprog').textContent=done+' / '+N;
   if(done<N)requestAnimationFrame(step);else cb(q(arr));}
  requestAnimationFrame(step);}
 document.getElementById('runmc').onclick=()=>animate(false,r=>{
  document.getElementById('mcq').innerHTML=STATES.map((s,i)=>{const qq=mcEngine(S.knobs)[s];
   return`<div class="stat"><div class="v" style="color:${SCOLOR[s]}">${pct(qq.P50)}</div>
    <div class="l">${SLABEL[s]}<br>P10 ${pct1(qq.P10)} · P90 ${pct1(qq.P90)}</div></div>`;}).join('');
  drawEnsemble();});
 document.getElementById('runmc4').onclick=()=>animate(true,()=>toast('已用锁死向心力重跑'));

 function drawEnsemble(){
  const m1=mcEngine(S.knobs),m2=mcEngine(S.knobs,{bayesCoef:true,seedOff:1}),m3=mcM3(S.knobs),bm4=m4(S.knobs);
  const cv=document.getElementById('ens'),{ctx,w,h}=setupCanvas(cv),pad=46;
  const cols=['#3ee0ff','#5aa2ff','#ffb454','#8b7bff'];
  const data=STATES.map((s,i)=>[m1[s].P50,m2[s].P50,m3[s].P50,bm4[i]]);
  const gw=(w-pad-10)/4;
  data.forEach((vals,gi)=>{const mx=Math.max(...data.flat());
   vals.forEach((v,mi)=>{const bw=gw/5,bh=(v/mx)*(h-46);
    ctx.fillStyle=cols[mi];ctx.beginPath();
    ctx.roundRect(pad+gi*gw+6+mi*bw,h-28-bh,bw-2,bh,3);ctx.fill();});
   ctx.fillStyle='#93a2c0';ctx.font='10px sans-serif';ctx.textAlign='center';
   ctx.fillText(['回归','外部','内部','黑天鹅'][gi],pad+gi*gw+gw/2,h-12);});
  document.getElementById('enstable').innerHTML=STATES.map((s,i)=>`
   <div class="barline"><span class="lab">${SLABEL[s]}</span><div class="track"></div>
    <span class="num">${pct1(m1[s].P50)} / ${pct1(m2[s].P50)} / ${pct1(m3[s].P50)} / ${pct1(bm4[i])}</span></div>`).join('');
 }
 drawEnsemble();
 if(!S.modelDone){setTimeout(()=>{const b=document.getElementById('runmc');if(b)b.click();
  S.modelDone=true;save();},400);}
};

R.sna=function(el){

 const fg=new ForceGraph(DATA.edges,document.getElementById('fc'));let raf=null,isoStep=0;
 function loop(){fg.tick();fg.draw();raf=requestAnimationFrame(loop);}
 loop();
 document.getElementById('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=null;}else loop();};

 const g=buildGraph(DATA.edges),hub=g.idx['黄仁勋本人'];
 document.getElementById('bct').innerHTML=g.names.map((n,i)=>{

 // 时间切片：逐步移除枢纽边，重算其加权度
 const links=DATA.edges.map(e=>({a:g.idx[e.source],b:g.idx[e.target],s:e.strength}));
 const hubLinks=links.filter(l=>l.a===hub||l.b===hub).sort((u,v)=>v.s-u.s);

 for(let rm=0;rm<=hubLinks.length;rm++){

  series.push(adj[hub].reduce((a,b)=>a+b,0));}
 drawLine(document.getElementById('sl'),[{data:series,color:'#3ee0ff'}],
  {labels:series.map((_,i)=>i),zero:false});
};

  <div class="divider"></div>

  <div class="row between" style="margin-top:8px"><span class="sub">你的直觉原型</span><b style="font-size:13px">${intuitionTxt}</b></div>
  <div class="row between" style="margin-top:8px"><span class="sub">模型给回归的概率</span><b class="grn mono">${pct(modelComeback)}</b></div>
  <div class="row between" style="margin-top:8px"><span class="sub">模型首选结局</span><b class="cyan">${SLABEL[STATES[p.indexOf(Math.max(...p))]]}</b></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>对账结论</h3>
  <p class="sub" style="margin:10px 0 0">你和模型的差别不在结论，在权重：你给“人心”和“程序”分配了多少。
  模型不评判你，它只是把假设摆到台面。你可以回到“变量数据”拖动旋钮，用它校准你自己的权重。</p></div>
 <div class="row" style="margin-top:16px">
  <button class="btn primary sm grow" onclick="go('vars')">回去调权重</button>
  <button class="btn ghost sm grow" id="restart">清空重玩</button></div>
 <p class="mut" style="font-size:11px;margin-top:16px">本模拟器为社会计算教学与研究工具，不构成投资建议；主观读数均为显式假设，缺证据不插值。</p>
 </div>`;
 document.getElementById('restart').onclick=()=>{localStorage.removeItem(KEY);S=fresh();save();render();};
};

/* ================= 启动 ================= */
if(!location.hash)location.hash='#open';
render();
</script>
</body>
